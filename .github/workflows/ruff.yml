name: Ruff Lint

on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "src/**"

jobs:
  ruff:
    name: Ruff Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Ruff Lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
